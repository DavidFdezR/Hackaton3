<template>
    <lightning-card title="Case files" icon-name="standard:file">
        <div class="slds-p-horizontal_small">
            <lightning-file-upload label="Attach files" record-id={recordId} onuploadfinished={handleUploadFinished} multiple></lightning-file-upload>
            <template lwc:if={hasFiles}>
                <ul class="files">
                    <template for:each={uploaded} for:item="file">
                        <li key={file.key} class="file-name">{file.name}</li>
                    </template>
                </ul>
            </template>
        </div>
    </lightning-card>
</template>
